<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragments/util :: head-content(title='Pro Fit - Planos')}"></div>
</head>
<body class="d-flex flex-column min-vh-100">
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	<div th:replace="~{fragments/util :: mensagens}"></div>

	<main class="container my-4">
		<h2 class="mb-4">Lista de planos</h2>

		<div class="table-responsive">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-dark">
					<tr>
						<th>Nome</th>
						<th>Preço</th>
						<th>Modalidade</th>
						<th>Data de inicio</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="p : ${listaPlano}">
						<td th:text="${p.nome}"></td>
						<td th:text="${p.preco}"></td>
						<td th:text="${p.modalidade}"></td>
						<td th:text="${p.dataInicio}"></td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaPlano)}">
						<td colspan="6" class="text-center text-muted py-4">Nenhum Plano cadastrado.</td>
					</tr>
				</tbody>	
			</table>
			<div class="text-end" sec:authorize="hasAnyRole('ADMIN')">
				<a th:href="@{/plano/cadastrar}" class="btn btn-primary bg-primary-pf">Cadastrar</a>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
