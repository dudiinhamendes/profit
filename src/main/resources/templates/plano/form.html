<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragments/util :: head-content(title='Pro Fit - Planos')}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
	<header th:replace="~{fragments/util :: cabecalho}"></header>

	<main class="container my-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow-sm">
					<div class="card-header bg-primary-pf text-white">
						<h5 class="mb-0" th:if="${plano.id}" th:text="${edit} ? 'Edição do plano' : ${plano.nome}"></h5>
						<h5 class="mb-0" th:unless="${plano.id}">Cadastro de plano</h5>
					</div>
					<div class="card-body">

						<form th:action="@{/plano/salvar}" th:object="${plano}" method="POST" th:if="${plano.id == null OR edit}">
							<input type="hidden" th:field="*{id}">

							<div class="mb-3">
								<label for="name" class="form-label">Nome</label>
								<input type="text" class="form-control" id="name" placeholder="Digite o plano" required th:field="*{nome}">
							</div>
							<div class="mb-3">
								<label for="preco" class="form-label">Preço</label>
								<input type="text" class="form-control" id="preco" placeholder="Digite o preço" required th:field="*{preco}">
							</div>
							<div class="mb-3">
								<label for="modalidade" class="form-label">Modalidade</label>
								<select class="form-select" id="modalidade" th:field="*{modalidade}">
									<option value="modalidade" selected>Escolha a modalidade do plano...</option>
									<option value="mensal">Mensal</option>
									<option value="semestral">Semestral</option>
									<option value="anual">Anual</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="dataInicio" class="form-label">Data de início</label>
								<input type="date" class="form-control" id="dataInicio" placeholder="Digite a data de início" required th:field="*{dataInicio]">
							</div>
							<div class="d-flex gap-3">
								<a href="/" class="btn btn-secondary w-100">Cancelar</a>
								<button type="submit" class="btn btn-primary bg-primary-pf w-100">Salvar</button>
							</div>
						</form>

						<div class="card-body" th:unless="${plano.id == null OR edit}">
							<div class="mb-3">
								<label class="form-label text-muted">Nome</label>
								<div class="form-control-plaintext fw-bold" th:text="${plano.nome}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label text-muted">Preço</label>
								<div class="form-control-plaintext fw-bold" th:text="${plano.preco}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label text-muted">Modalidade</label>
								<div class="form-control-plaintext fw-bold" th:text="${plano.modalidade}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label text-muted">Data de início</label>
								<div class="form-control-plaintext fw-bold" th:text="${plano.dataInicio}"></div>
							</div>
							<a th:href="@{/plano/editar(id=${plano.id})}" class="btn btn-primary bg-primary-pf w-100" sec:authorize="hasAnyRole('ADMIN','ATENDENTE')">Editar plano</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
