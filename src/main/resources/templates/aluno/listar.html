<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragments/util :: head-content(title='Pro Fit - Alunos')}"></div>
</head>
<body class="d-flex flex-column min-vh-100">
	<header th:replace="~{fragments/util :: cabecalho}"></header>

	<main class="container my-4">
		<h2 class="mb-4">Lista de Alunos</h2>

		<div class="table-responsive">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-dark">
					<tr>
						<th>Nome</th>
						<th>Telefone</th>
						<th>Situação</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="a : ${listaAluno}">
						<td th:text="${a.nome}"></td>
						<td th:text="${a.telefone}"></td>
						<td>
							<span th:if="${a.ativo}" class="badge bg-success">Ativo</span>
							<span th:unless="${a.ativo}" class="badge bg-warning">Inativo</span>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaAluno)}">
						<td colspan="6" class="text-center text-muted py-4">Nenhum aluno cadastrado.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
