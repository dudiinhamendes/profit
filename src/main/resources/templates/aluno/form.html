<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragments/util :: head-content(title='Pro Fit - Aluno')}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/util :: cabecalho}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary-pf text-white">
                        <h5 class="mb-0">Cadastro de aluno</h5>
                    </div>
                    <div class="card-body">

                        <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
                        <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

                        <form th:action="@{/aluno/salvar}" th:object="${aluno}" method="POST">

                            <div class="mb-3">
                                <label for="fullName" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Digite o nome" required th:field="*{nome}">
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Digite nome para login" required th:field="*{username}">
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="Digite senha" required th:field="*{senha}">
                            </div>

                            <div class="mb-3">
                                <label for="sexo" class="form-label">Sexo</label>
                                <select class="form-select" id="sexo" required th:field="*{sexo}">
                                    <option value="">Selecione...</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="plano" class="form-label">Plano</label>
                                <input type="text" class="form-control" id="plano" placeholder="Digite o plano (opcional)" th:field="*{id_plano}">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="esta-ativo" th:field="*{ativo}">
                                <label class="form-check-label" for="esta-ativo">Ativo</label>
                            </div>

                            <div class="d-flex gap-3">
                                <a th:href="@{/}" class="btn btn-secondary w-100">Cancelar</a>
                                <button type="submit" class="btn btn-primary bg-primary-pf w-100">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
