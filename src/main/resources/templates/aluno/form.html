<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragments/util :: head-content(title='Pro Fit - Aluno')}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/util :: cabecalho}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary-pf text-white">
						<h5 class="mb-0" th:if="${aluno.id}" th:text="${edit} ? 'Edição de usuário' : ${aluno.nome}">Bug</h5>
                        <h5 class="mb-0" th:unless="${aluno.id}">Cadastro de aluno</h5>
                    </div>
                    <div class="card-body">

                        <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
                        <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

						<form th:action="@{/aluno/salvar}" th:object="${aluno}" method="POST" th:if="${aluno.id == null OR edit}">
							<input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="fullName" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Digite o nome" required th:field="*{nome}">
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Digite nome para login" required th:field="*{username}">
                            </div>
							
							<div class="mb-3">
								<label for="telefone" class="form-label">Telefone</label>
								<input type="tel" class="form-control" id="telefone" placeholder="Digite telefone para login" required th:field="*{telefone}">
						    </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="Digite senha" required th:field="*{senha}">
                            </div>

                            <div class="mb-3">
                                <label for="sexo" class="form-label">Sexo</label>
                                <select class="form-select" id="sexo" required th:field="*{sexo}">
                                    <option value="">Selecione...</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>


                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="esta-ativo" th:field="*{ativo}">
                                <label class="form-check-label" for="esta-ativo">Ativo</label>
                            </div>

                            <div class="d-flex gap-3">
                                <a th:href="@{/}" class="btn btn-secondary w-100">Cancelar</a>
                                <button type="submit" class="btn btn-primary bg-primary-pf w-100">Salvar</button>
                            </div>
                        </form>
						
						<div class="card-body" th:unless="${aluno.id == null OR edit}">
							<div class="mb-3">
                                <label class="form-label text-muted">Nome</label>
                                <div class="form-control-plaintext fw-bold" th:text="${aluno.nome}">Lorem Ipsum</div>
                            </div>
							<div class="mb-3">
							    <label class="form-label text-muted">Telefone</label>
							    <div class="form-control-plaintext fw-bold" th:text="${aluno.telefone}">Lorem Ipsum</div>
							</div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Username</label>
                                <div class="form-control-plaintext fw-bold" th:text="${aluno.username}">Lorem Ipsum</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Status</label>
                                <div>
                                    <span class="badge bg-success" th:if="${aluno.ativo}">Ativo</span>
                                    <span class="badge bg-warning" th:unless="${aluno.ativo}">Inativo</span>
                                </div>
                            </div>
                            <a th:href="@{/aluno/editar(id=${aluno.id})}" class="btn btn-primary bg-primary-pf w-100" sec:authorize="hasAnyRole('ADMIN','ATENDENTE')">Editar aluno</a>
                        </div>
                    </div>
                </div>

               
                <div class="card shadow-sm mt-4" th:unless="${aluno.id == null OR edit}" sec:authorize="hasAnyRole('ADMIN','PROFESSOR', 'ATENDENTE')">
                    <div class="card-header bg-primary-pf text-white">
                        <h5 class="mb-0">Avaliação Física</h5>
                    </div>
                    <div class="card-body">

                        <p class="text-muted" th:if="${#lists.isEmpty(avaliacoes)}">Nenhuma avaliação cadastrada para este aluno.</p>

                        <div class="table-responsive" th:unless="${#lists.isEmpty(avaliacoes)}">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>Professor</th>
                                        <th>Peso (kg)</th>
                                        <th>% Gordura</th>
                                        <th>Altura (m)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="av : ${avaliacoes}">
                                        <td th:text="${av.professor.nome}">Lorem Ipsum</td>
                                        <td th:text="${#numbers.formatDecimal(av.peso, 1, 'NONE', 2, 'COMMA')}">70,80</td>
                                        <td th:text="${#numbers.formatDecimal(av.percentualGordura, 1, 'NONE', 2, 'COMMA')}">15,20</td>
                                        <td th:text="${#numbers.formatDecimal(av.altura, 1, 'NONE', 2, 'COMMA')}">1,72</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <hr>

                        <h6 class="mb-3">Nova avaliação</h6>
                        <form th:action="@{/avaliacao-fisica/salvar}" method="POST">
                            <input type="hidden" name="aluno.id" th:value="${aluno.id}">

                            <div class="mb-3">
                                <label for="avProfessor" class="form-label">Professor</label>
                                <select class="form-select" id="avProfessor" name="professor.id" required>
                                    <option value="">Selecione...</option>
                                    <option th:each="p : ${listaProfessor}" th:value="${p.id}" th:text="${p.nome}">Professores</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="avPeso" class="form-label">Peso (kg)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="avPeso" name="peso" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="avGordura" class="form-label">% Gordura</label>
                                    <input type="number" step="0.01" min="0" max="100" class="form-control" id="avGordura" name="percentualGordura" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="avAltura" class="form-label">Altura (m)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="avAltura" name="altura" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary bg-primary-pf w-100">Adicionar avaliação</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
