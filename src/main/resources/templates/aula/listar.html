<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragments/util :: head-content(title='Pro Fit - Aulas')}"></div>
</head>
<body class="d-flex flex-column min-vh-100">
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	<div th:replace="~{fragments/util :: mensagens}"></div>

	<main class="container my-4">
		<h2 class="mb-4">Lista de Aulas</h2>

		<div class="table-responsive">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-dark">
					<tr>
						<th>Nome</th>
						<th>Horário</th>
						<th>Professor</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="a : ${listaAula}" th:onclick="|window.location.href='@{/aula/visualizar?id={id}(id=${a.id})}'|" style="cursor: pointer;">
						<td th:text="${a.nome}"></td>
						<td th:text="${a.horarioFormatado}"></td>
						<td th:text="${a.professor.nome}"></td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaAula)}">
						<td colspan="6" class="text-center text-muted py-4">Nenhuma aula cadastrada.</td>
					</tr>
				</tbody>	
			</table>
			<div class="text-end" sec:authorize="hasAnyRole('PROFESSOR','ADMIN','ATENDENTE')">
				<a th:href="@{/aula/cadastrar}" class="btn btn-primary bg-primary-pf">Cadastrar</a>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
