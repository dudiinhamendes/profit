<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragments/util :: head-content(title='Pro Fit - Aula')}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/util :: cabecalho}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary-pf text-white">
                        <h5 class="mb-0" th:if="${aula.id}" th:text="${edit} ? 'Edição de aula' : ${aula.nome}">Bug</h5>
                        <h5 class="mb-0" th:unless="${aula.id}">Cadastro de aula</h5>
                    </div>
                    <div class="card-body">

                        <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
                        <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

                        <form th:action="@{/aula/salvar}" th:object="${aula}" method="POST" th:if="${aula.id == null OR edit}">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome da aula</label>
                                <input type="text" class="form-control" id="nome" placeholder="Digite o nome da aula" required th:field="*{nome}">
                            </div>

                            <div class="mb-3">
                                <label for="horario" class="form-label">Data e horário</label>
                                <input type="datetime-local" class="form-control" id="horario" required th:field="*{horario}">
                            </div>

                            <div class="mb-3">
                                <label for="professor" class="form-label">Professor</label>
                                <select class="form-select" id="professor" name="professor" required>
                                    <option value="">Selecione...</option>
                                    <option th:each="p : ${listaProfessor}"
                                            th:value="${p.id}"
                                            th:text="${p.ativo} ? ${p.nome} : ${p.nome + ' (inativo)'}"
                                            th:selected="${aula.professor != null and aula.professor.id == p.id}">
                                        Professor
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Alunos</label>

                                <div class="border rounded p-2" style="max-height: 260px; overflow-y: auto;">
                                    <div class="form-check py-1" th:each="a : ${listaAluno}">
                                        <input class="form-check-input" type="checkbox"
                                               name="alunos"
                                               th:id="${'aluno-' + a.id}"
                                               th:value="${a.id}"
                                               th:checked="${aula.alunos.![id].contains(a.id)}">
                                        <label class="form-check-label" th:for="${'aluno-' + a.id}">
                                            <span th:text="${a.nome}">Nome do aluno</span>
                                            <span class="badge bg-warning text-dark ms-1" th:unless="${a.ativo}">Inativo</span>
                                        </label>
                                    </div>

                                    <div class="text-center text-muted py-3" th:if="${#lists.isEmpty(listaAluno)}">
                                        Nenhum aluno cadastrado.
                                    </div>
                                </div>
                                <div class="form-text">Marque todos os alunos que participam desta aula.</div>
                            </div>

                            <div class="d-flex gap-3">
                                <a th:href="@{/aula/listar}" class="btn btn-secondary w-100">Cancelar</a>
                                <button type="submit" class="btn btn-primary bg-primary-pf w-100">Salvar</button>
                            </div>
                        </form>

                        <div class="card-body" th:unless="${aula.id == null OR edit}">
                            <div class="mb-3">
                                <label class="form-label text-muted">Nome da aula</label>
                                <div class="form-control-plaintext fw-bold" th:text="${aula.nome}">Lorem Ipsum</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">Data e horário</label>
                                <div class="form-control-plaintext fw-bold"
                                     th:text="${#temporals.format(aula.horario, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">Professor</label>
                                <div class="form-control-plaintext fw-bold" th:text="${aula.professor.nome}">Lorem Ipsum</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">
                                    Alunos
                                    <span class="badge bg-primary ms-1" th:text="${#lists.size(aula.alunos)}">0</span>
                                </label>

                                <ul class="list-group" th:unless="${#lists.isEmpty(aula.alunos)}">
                                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="a : ${aula.alunos}">
                                        <span th:text="${a.nome}">Nome do aluno</span>
                                        <span class="badge bg-warning text-dark" th:unless="${a.ativo}">Inativo</span>
                                    </li>
                                </ul>

                                <div class="text-muted" th:if="${#lists.isEmpty(aula.alunos)}">Nenhum aluno nesta aula.</div>
                            </div>

                            <div class="d-flex gap-3">
                                <a th:href="@{/aula/listar}" class="btn btn-secondary w-100">Voltar</a>
                                <a th:href="@{/aula/editar(id=${aula.id})}" class="btn btn-primary bg-primary-pf w-100"
                                   sec:authorize="hasAnyRole('ADMIN','ATENDENTE','PROFESSOR')">Editar aula</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
