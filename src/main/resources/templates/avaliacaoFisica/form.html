<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragments/util :: head-content(title='Pro Fit - Avaliação Física')}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/util :: cabecalho}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary-pf text-white">
                        <h5 class="mb-0">Cadastro de aluno</h5>
                    </div>
                    <div class="card-body">

                        <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
                        <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

                        <form th:action="@{/avaliacao-fisica/salvar}" th:object="${avaliacaoFisica}" method="POST">

							<input type="text" th:field="*{aluno}" class="d-none">
							
                            <div class="mb-3">
                                <label for="peso" class="form-label">Peso</label>
                                <input type="number" step="any" class="form-control" id="peso" placeholder="Digite o peso" required th:field="*{peso}">
                            </div>
							
							<div class="mb-3">
							     <label for="percentualGordura" class="form-label">Percentual de Gordura</label>
							     <input type="number" step="any" class="form-control" id="percentualGordura" placeholder="Digite o percentual de gordura" required th:field="*{percentualGordura}">
							</div>
							
							<div class="mb-3">
								  <label for="altura" class="form-label">Altura</label>
								  <input type="number" step="any" class="form-control" id="altura" placeholder="Digite a altura" required th:field="*{altura}">
							</div>

                            <div class="d-flex gap-3">
                                <a th:href="@{/}" class="btn btn-secondary w-100">Cancelar</a>
                                <button type="submit" class="btn btn-primary bg-primary-pf w-100">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
