<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragments/util :: head-content(title='Pro Fit - Usuarios')}"></div>
</head>
<body class="d-flex flex-column min-vh-100">
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	<div th:replace="~{fragments/util :: mensagens}"></div>

	<main class="container my-4">
		<h2 class="mb-4">Usuarios</h2>

		<div class="table-responsive">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-dark">
					<tr>
						<th>Nome</th>
						<th>Nivel de Acesso</th>
						<th>Data de Criação</th>
						<th>Situação</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="u : ${listaUsuario}" th:onclick="|window.location.href='@{/usuario/visualizar?id={id}(id=${u.id})}'|" style="cursor: pointer;">
						<td th:text="${u.nome}"></td>
						<td th:text="${u.role}"></td>
						<td th:text="${u.dataCriacao}"></td>
						<td>
							<span th:if="${u.ativo}" class="badge bg-primary">Ativo</span>
							<span th:unless="${u.ativo}" class="badge bg-warning">Inativo</span>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaUsuario)}">
						<td colspan="6" class="text-center text-muted py-4">Nenhum usuario cadastrado.</td>
					</tr>
				</tbody>	
			</table>
			<div class="text-end" sec:authorize="hasAnyRole('ADMIN')">
				<a th:href="@{/usuario/cadastrar}" class="btn btn-primary bg-primary-pf">Cadastrar</a>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>

</html>
